<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>お金</title>
<style>
:root{
  --bg:#000; --group:#1C1C1E; --group2:#2C2C2E; --fill:#3A3A3C;
  --label:#FFF; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6);
  --green:#30D158; --red:#FF453A; --blue:#0A84FF; --indigo:#5E5CE6;
  --green-bg:rgba(48,209,88,.15); --red-bg:rgba(255,69,58,.15);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--label);
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;background:#000;
  padding-top:env(safe-area-inset-top)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.rnd{font-family:ui-rounded,-apple-system,sans-serif}
button,input,select,textarea{font-family:inherit;color:inherit}
input,select,textarea{background:var(--group2);border:0;border-radius:8px;padding:9px 12px;font-size:15px;width:100%}
input:focus,textarea:focus{outline:1.5px solid var(--blue)}

.lt{padding:14px 20px 4px;display:flex;align-items:flex-end}
.lt h1{font-size:32px;font-weight:800}
.lt .r{margin-left:auto;text-align:right;padding-bottom:5px}
.lt .sync{font-size:11.5px;color:var(--ter)}
.period{font-size:13px;color:var(--sec);font-weight:600;padding:0 20px 4px}

main{padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.on{display:block}
.sect{font-size:13px;font-weight:600;color:var(--sec);padding:16px 16px 7px}
.group{background:var(--group);border-radius:12px;overflow:hidden}
.row44{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative}
.row44+.row44::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.chev{color:var(--ter);font-size:15px;font-weight:600}
.footnote{font-size:12.5px;color:var(--sec);padding:7px 16px 0}
.footnote.warn{color:var(--red);font-weight:600}
.footnote.ok{color:var(--green);font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--sec);font-size:13.5px;line-height:1.7}
.btn{background:var(--group2);border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;width:100%;cursor:pointer}
.btn.pri{background:var(--blue);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{width:auto;padding:7px 14px;font-size:13px;border-radius:8px}

.wallet{margin-top:8px;border-radius:16px;padding:18px 20px 15px;
  background:linear-gradient(135deg,#2E2E31 0%,#1C1C1E 55%,#232326 100%);
  border:.5px solid rgba(255,255,255,.08)}
.wallet .lbl{font-size:13px;font-weight:600;color:var(--sec)}
.wallet .amt{font-size:46px;font-weight:800;line-height:1.15;margin:2px 0 3px;letter-spacing:-.01em}
.wallet .amt .yen{font-size:24px;font-weight:700;color:var(--sec);margin-right:2px}
.wallet .sub{font-size:13px;color:var(--sec)}
.wallet .sub b{color:var(--label);font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;vertical-align:8px;margin-left:8px}
.pill.g{color:var(--green);background:var(--green-bg)}
.pill.r{color:var(--red);background:var(--red-bg)}

.pace .tag{font-size:14px;width:70px}
.bar{flex:1;height:5px;background:var(--fill);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--sec)}
.bar i.over{background:var(--red)}
.pct{font-size:14px;font-weight:600;width:44px;text-align:right;color:var(--sec)}

.airow .ic{width:29px;height:29px;border-radius:7px;background:var(--indigo);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.airow .txt{flex:1;font-size:14px;line-height:1.55;padding:2px 0}

.cat .nm{width:104px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .rest{width:80px;text-align:right;font-size:14px;font-weight:600}
.cat .rest.over{color:var(--red)}

.isq{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--group2);color:var(--sec)}
.tr2 .shop{flex:1;min-width:0}
.tr2 .s1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr2 .s2{font-size:12px;color:var(--sec);margin-top:1px}
.tr2 .amt{font-size:15px;font-weight:600;white-space:nowrap}
.tag2{font-size:11px;font-weight:600;background:var(--group2);color:var(--sec);border-radius:6px;padding:2.5px 8px;white-space:nowrap}
.tag2.k{background:rgba(10,132,255,.16);color:var(--blue)}
.tr2.off{opacity:.5}
.tr2.off .amt{text-decoration:line-through;text-decoration-thickness:1px}

.chat{display:flex;flex-direction:column;gap:9px;padding-top:10px;min-height:40vh}
.bub{max-width:82%;padding:9px 14px;border-radius:19px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.bub.ai2{align-self:flex-start;background:var(--group2);border-bottom-left-radius:6px}
.ibar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;padding:10px 14px;background:linear-gradient(transparent,#000 45%)}
.ibar input{flex:1;border-radius:18px;border:1px solid var(--fill);background:#111}
.ibar .rbtn{width:36px;height:36px;border-radius:50%;background:var(--group2);border:0;font-size:16px;flex-shrink:0;cursor:pointer}
.ibar .rbtn.send{background:var(--blue)}

.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50}
.sheet-wrap.on{display:flex;align-items:flex-end}
.sheet{background:#161618;border-radius:16px 16px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;font-weight:700;margin-bottom:12px}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:12.5px;color:var(--sec);margin-bottom:5px;font-weight:600}
.frow .inline{display:flex;gap:8px}
.seg{display:flex;background:var(--group2);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:none;padding:7px 0;font-size:13px;font-weight:600;color:var(--sec);border-radius:7px;cursor:pointer}
.seg button.on{background:#636366;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));background:#2C2C2EF0;padding:10px 18px;border-radius:20px;font-size:13.5px;font-weight:600;z-index:99;display:none}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(22,22,24,.85);backdrop-filter:blur(20px) saturate(160%);border-top:.5px solid var(--sep);display:flex;padding:6px 4px calc(14px + env(safe-area-inset-bottom));z-index:40}
nav button{flex:1;background:none;border:0;font-size:10px;font-weight:500;color:var(--ter);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button .ic{font-size:20px;line-height:1.15}
nav button.on{color:var(--green)}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="lt"><h1 id="ttl">お金</h1><div class="r"><div class="sync num" id="syncInfo">未同期</div></div></div>
<div class="period num" id="periodLbl" style="display:flex;align-items:center;gap:10px">
  <button id="perPrev" style="background:var(--group2);border:0;border-radius:7px;width:28px;height:24px;color:var(--label);font-size:13px;cursor:pointer">‹</button>
  <span id="perTxt" style="flex:1"></span>
  <button id="perNext" style="background:var(--group2);border:0;border-radius:7px;width:28px;height:24px;color:var(--label);font-size:13px;cursor:pointer">›</button>
</div>

<main>
<!-- ホーム -->
<section class="screen on" id="s-home"></section>
<!-- 明細 -->
<section class="screen" id="s-tx"></section>
<!-- 相談 -->
<section class="screen" id="s-chat">
  <div class="chat" id="chatLog"></div>
</section>
<!-- レポート -->
<section class="screen" id="s-rep"></section>
<!-- 設定 -->
<section class="screen" id="s-set"></section>
</main>

<div class="ibar hidden" id="ibar">
  <button class="rbtn" id="btnPhoto">📷</button>
  <input id="aiIn" placeholder="聞く・入力（例：コンビニ800円）" autocomplete="off">
  <button class="rbtn send" id="btnSend">↑</button>
  <input type="file" id="photoFile" accept="image/*" capture="environment" class="hidden">
</div>
<input type="file" id="csvFile" accept=".csv,text/csv" class="hidden">
<input type="file" id="jsonFile" accept=".json,application/json" class="hidden">

<div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<nav>
  <button class="on" data-s="s-home"><span class="ic">⌂</span>ホーム</button>
  <button data-s="s-tx"><span class="ic">☰</span>明細</button>
  <button data-s="s-chat"><span class="ic">◐</span>相談</button>
  <button data-s="s-rep"><span class="ic">◫</span>レポート</button>
  <button data-s="s-set"><span class="ic">⚙</span>設定</button>
</nav>

<script>
/* ================== お金 v1 ================== */
const APP_VER='2026-08-29-k';
const STORE_KEY='okane_v1';
const DEF_CATS=['食費','日用品','交通','服・美容','趣味・娯楽','サブスク・固定費','その他'];
let S=null, curTab='s-home', chatHist=[], perOff=0, cardFilter='', catFilter='', keihiFilter=false;

/* ---------- storage (versioned) ---------- */
function defState(){return {sver:1, tx:[], cats:[...DEF_CATS],
  budget:{total:0, per:{}}, goal:{save:0, note:''}, fixed:[], rules:{}, krules:{}, debts:[], repays:[],
  set:{gasUrl:'', pass:'', startDay:25},
  aiNote:'', lastSync:0};}
function load(){
  try{const raw=localStorage.getItem(STORE_KEY);
    if(!raw){S=defState();return;}
    S=JSON.parse(raw);
    if(!S.sver){S.sver=1;} // future migrations branch on sver
    if(!S.cats||!S.cats.length)S.cats=[...DEF_CATS];
    // 既存ユーザーにも新カテゴリを追加（「その他」の手前に挿す）
    DEF_CATS.forEach(c=>{ if(!S.cats.includes(c)){ const i=S.cats.indexOf('その他'); if(i>=0)S.cats.splice(i,0,c); else S.cats.push(c);} });
    if(!S.set)S.set={gasUrl:'',pass:'',startDay:25};
    if(!S.fixed)S.fixed=[];
    if(!S.rules)S.rules={};
    if(!S.krules)S.krules={};
    if(!S.debts)S.debts=[];
    if(!S.repays)S.repays=[];
  }catch(e){S=defState();}
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}}
addEventListener('pagehide',save); addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});

/* ---------- helpers ---------- */
const $=q=>document.querySelector(q);
function fmt(n){return '¥'+Math.round(n).toLocaleString('ja-JP');}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200);}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function txId(t){ // stable dedup id
  return 'h'+btoa(unescape(encodeURIComponent([t.src,t.date,t.amount,t.store].join('|')))).replace(/[^a-zA-Z0-9]/g,'').slice(0,24);
}

/* period: startDay始まり */
function period(base){
  const d=base?new Date(base):new Date();
  if(!base&&perOff)d.setMonth(d.getMonth()+perOff);
  const sd=S.set.startDay||25;
  let s,e;
  if(d.getDate()>=sd){s=new Date(d.getFullYear(),d.getMonth(),sd);e=new Date(d.getFullYear(),d.getMonth()+1,sd);}
  else{s=new Date(d.getFullYear(),d.getMonth()-1,sd);e=new Date(d.getFullYear(),d.getMonth(),sd);}
  return {s,e}; // [s, e)
}
function inPeriod(dateStr,p){const d=new Date(dateStr+'T12:00');return d>=p.s&&d<p.e;}
function perLbl(p){
  const endDisp=new Date(p.e-86400000);
  return (endDisp.getMonth()+1)+'月期 '+(p.s.getMonth()+1)+'/'+p.s.getDate()+'–'+(endDisp.getMonth()+1)+'/'+endDisp.getDate();
}

/* ---------- GAS API ---------- */
async function api(action,payload){
  if(!S.set.gasUrl)throw new Error('NO_GAS');
  const r=await fetch(S.set.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({token:S.set.pass,action,payload})});
  const j=await r.json();
  if(j.error)throw new Error(j.error);
  return j;
}
async function syncPull(silent){
  try{
    const j=await api('pull',{since:S.lastSync||0});
    let added=0;
    (j.tx||[]).forEach(t=>{ if(!S.tx.find(x=>x.id===t.id)){
        if(t.src==='mail'){const rc=ruleFor(t.store); if(rc)t.cat=rc; if(!t.keihi&&keihiFor(t.store))t.keihi=true;}
        S.tx.push(t);added++;}
      else{const i=S.tx.findIndex(x=>x.id===t.id); if(S.tx[i].serverWins!==false)Object.assign(S.tx[i],t);} });
    S.lastSync=j.now||Date.now(); save(); renderAll();
    $('#syncInfo').textContent='同期 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    if(!silent&&added)toast(added+'件 取り込み');
  }catch(e){ if(e.message!=='NO_GAS'&&!silent)toast('同期エラー'); $('#syncInfo').textContent=S.set.gasUrl?'同期エラー':'ローカルのみ'; }
}
async function pushTx(list){ try{ await api('add',{tx:list}); }catch(e){} }

/* ---------- tx ops ---------- */
function addTx(t,opts){
  t.id=t.id||txId(t); t.createdAt=Date.now();
  if(S.tx.find(x=>x.id===t.id)){ if(!(opts&&opts.silent))toast('重複のためスキップ'); return false; }
  S.tx.push(t); save(); pushTx([t]); return true;
}
function updateTx(id,patch){const i=S.tx.findIndex(x=>x.id===id); if(i<0)return; Object.assign(S.tx[i],patch); S.tx[i].serverWins=false; save(); pushTx([S.tx[i]]); renderAll();}

/* ---------- 借金・返済 ---------- */
function debtBal(d){
  const paid=(S.repays||[]).filter(r=>r.debtId===d.id).reduce((a,r)=>a+(+r.amount||0),0);
  return Math.max(0,(+d.total||0)-paid);
}
function debtStats(){
  const list=(S.debts||[]).map(d=>{
    const bal=debtBal(d);
    const paid=(+d.total||0)-bal;
    const m=+d.monthly||0, rate=(+d.rate||0)/100/12;
    let months=null, interest=0, sim=bal;
    if(m>0&&bal>0){
      months=0;
      const minPay=sim*rate;
      if(m<=minPay+1){ months=Infinity; }
      else{
        while(sim>0&&months<600){ const i=sim*rate; interest+=i; sim=sim+i-m; months++; }
      }
    }
    const end=(months!==null&&isFinite(months))?new Date(new Date().getFullYear(),new Date().getMonth()+months,1):null;
    return {...d,bal,paid,months,interest:Math.round(interest),end,pct:d.total?Math.round(paid/d.total*100):0};
  });
  const totalBal=list.reduce((a,d)=>a+d.bal,0);
  const totalOrig=list.reduce((a,d)=>a+(+d.total||0),0);
  const monthly=list.reduce((a,d)=>a+(d.bal>0?(+d.monthly||0):0),0);
  const finite=list.filter(d=>d.bal>0&&d.months!==null&&isFinite(d.months));
  const lastEnd=finite.length?finite.reduce((a,d)=>d.end>a?d.end:a,finite[0].end):null;
  const p=period();
  const thisPeriodRepay=(S.repays||[]).filter(r=>inPeriod(r.date,p)).reduce((a,r)=>a+(+r.amount||0),0);
  return {list,totalBal,totalOrig,monthly,lastEnd,thisPeriodRepay,
    paidPct:totalOrig?Math.round((totalOrig-totalBal)/totalOrig*100):0};
}
function addRepay(debtId,amount,date){
  S.repays.push({id:uid(),debtId,amount:+amount||0,date:date||todayStr()});
  save();
}

/* ---------- render: home ---------- */
const FIXCAT='サブスク・固定費';
function stats(){
  const p=period();
  const inP=S.tx.filter(t=>inPeriod(t.date,p)&&!t.skip);
  const personal=inP.filter(t=>!t.keihi);
  const spent=personal.reduce((a,t)=>a+ (+t.amount||0),0);
  const keihi=inP.filter(t=>t.keihi);
  const keihiSum=keihi.reduce((a,t)=>a+(+t.amount||0),0);
  const perCat={}; S.cats.forEach(c=>perCat[c]=0);
  personal.forEach(t=>{perCat[t.cat]=(perCat[t.cat]||0)+(+t.amount||0);});
  const now=new Date();
  const totalDays=Math.round((p.e-p.s)/86400000);
  const passed=Math.min(totalDays,Math.max(0,Math.floor((now-p.s)/86400000)+1));
  const daysLeft=Math.max(0,totalDays-passed);
  // 固定費: 台帳の見込みを予算から先取りし、残りを変動費として管理
  const fixedPlan=S.fixed.filter(f=>!f.keihi).reduce((a,f)=>a+(+f.amount||0),0);
  const spentFix=perCat[FIXCAT]||0;
  const spentVar=spent-spentFix;
  const b=S.budget.total||0;
  const useFixed=fixedPlan>0&&b>0;
  const varBudget=useFixed?Math.max(0,b-fixedPlan):b;
  const left=useFixed?(varBudget-spentVar):Math.max(0,b-spent);
  return {p,spent,left,keihiSum,keihiCnt:keihi.length,perCat,totalDays,passed,daysLeft,personal,
    fixedPlan,spentFix,spentVar,varBudget,useFixed};
}
function renderHome(){
  const st=stats(); const b=S.budget.total||0;
  const el=$('#s-home');
  if(!S.tx.length&&!b){
    el.innerHTML='<div class="empty">まだデータがない。<br>設定で予算を入れて、下の入力バーかCSV取込で始めよう。</div>'
      +'<div style="padding:0 4px"><button class="btn pri" onclick="go(\'s-set\')">設定を開く</button></div>';
    return;
  }
  const dayPace=st.daysLeft>0?st.left/st.daysLeft:st.left;
  const pctDay=st.totalDays?Math.round(st.passed/st.totalDays*100):0;
  const useB=st.useFixed?st.varBudget:b;
  const useSpent=st.useFixed?st.spentVar:st.spent;
  const pctSpend=useB?Math.round(useSpent/useB*100):0;
  const over=useB&&pctSpend>pctDay;
  const kuro=useB?(st.left>=0):true;
  let h='<div class="wallet"><div class="lbl">今月あと使える額'+(st.useFixed?'（固定費を除いた自由枠）':'')+'</div>'
   +'<div class="amt num rnd"><span class="yen">¥</span>'+(b?Math.round(st.left).toLocaleString('ja-JP'):'—')
   +(b?('<span class="pill '+(kuro?'g':'r')+'">'+(kuro?'黒字':'赤字')+'</span>'):'')+'</div>'
   +'<div class="sub num">あと'+st.daysLeft+'日'+(b?(' ・ 1日 <b>'+fmt(Math.max(0,dayPace))+'</b> で'+S.set.startDay+'日まで持つ'):' ・ 予算未設定')+'</div></div>';
  if(b){
    h+='<div class="sect">ペース配分'+(st.useFixed?'（変動費）':'')+'</div><div class="group pace num">'
     +'<div class="row44"><span class="tag">日数</span><span class="bar"><i style="width:'+pctDay+'%"></i></span><span class="pct">'+pctDay+'%</span></div>'
     +'<div class="row44"><span class="tag">予算消化</span><span class="bar"><i class="'+(over?'over':'')+'" style="width:'+Math.min(100,pctSpend)+'%"></i></span><span class="pct" style="'+(over?'color:var(--red)':'')+'">'+pctSpend+'%</span></div></div>';
    if(over){h+='<div class="footnote warn">ややオーバーペース</div>';}
    else h+='<div class="footnote ok">ペース内</div>';
  }
  if(st.fixedPlan>0){
    h+='<div class="sect"></div><div class="group"><div class="row44 num" onclick="go(\'s-set\')">'
     +'<span class="isq" style="background:rgba(94,92,230,.2);color:var(--indigo)">固</span>'
     +'<span style="flex:1">固定費<br><span style="font-size:11px;color:var(--sec)">見込み '+fmt(st.fixedPlan)+' ・ 支払済 '+fmt(st.spentFix)+'</span></span>'

function upcomingFixed(days){
  const out=[]; const now=new Date(); now.setHours(0,0,0,0);
  const p=period();
  S.fixed.forEach(f=>{
    const day=Math.min(28,Math.max(1,+f.day||1));
    for(let m=0;m<2;m++){
      const d=new Date(now.getFullYear(),now.getMonth()+m,day);
      if(d<now||((d-now)/86400000)>days)continue;
      const paid=S.tx.some(t=>!t.skip&&inPeriod(t.date,p)&&Math.abs((+t.amount)-(+f.amount))<=Math.max(100,f.amount*0.05)&&(t.cat===FIXCAT||t.keihi===!!f.keihi));
      out.push({md:(d.getMonth()+1)+'/'+d.getDate(),name:f.name,amount:+f.amount,keihi:!!f.keihi,paid,ts:+d});
      break;
    }
  });
  return out.sort((a,b)=>a.ts-b.ts).slice(0,8);
}

    if(kind!==(t.skip?'s':(t.keihi?'k':'p'))&&kind!=='s')learnKeihi(ns,kind==='k');

      learnRule(ns,nc);
      const same=S.tx.filter(x=>x.id!==id&&!x.skip&&x.cat!==nc&&normKey(x.store)===normKey(ns));
      save();

         +'<div class="footnote">「'+esc(ns)+'」を '+esc(nc)+' として覚えた。過去の'+same.length+'件も同じにする？</div>'

  $('#e_del').onclick=()=>{ // two-step
    if($('#e_del').dataset.arm){S.tx=S.tx.filter(x=>x.id!==id);save();api('del',{id}).catch(()=>{});closeSheet();renderAll();toast('削除した');}
    else{$('#e_del').dataset.arm='1';$('#e_del').textContent='本当に削除する（もう一度タップ）';}};
};

/* ---------- CSV import (detect → mapping → preview) ---------- */
function bankRule(store){
  if(/カード|ｶｰﾄﾞ|ラクテン|ﾗｸﾃﾝ|楽天カ|三井住友カ|ミツイスミトモ|ﾐﾂｲｽﾐﾄﾓ|SMBCカ|JCB|AMEX|ビューカ|ETC/i.test(store))return{skip:true,why:'カード引落(二重防止)'};
  if(/ATM|引出|お引き?出し|ｷｬｯｼｭ|ギンコウATM|ｷﾞﾝｺｳATM/i.test(store))return{skip:true,why:'ATM引出'};
  if(/振込|フリコミ|ﾌﾘｺﾐ|口座振替/.test(store)&&/カンリコウザ|管理口座|ネツトフリコミ|ﾈﾂﾄﾌﾘｺﾐ/.test(store))return{skip:true,why:'振替の可能性'};
  if(/家賃|ヤチン|ﾔﾁﾝ|管理費|タカマツエステ|電気|ガス|水道|ＮＨＫ|NHK|保険|ホケン|mobile|ﾓﾊﾞｲﾙ|UQ|ＵＱ|ドコモ|ソフトバンク|ペイペイ|ﾍﾟｲﾍﾟｲ/i.test(store))return{cat:FIXCAT};
  return{cat:guessCat(store)};
}
function parseCsvText(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=text.split(/\r?\n/).map(l=>{
    const out=[];let cur='',q=false;
    for(let i=0;i<l.length;i++){const c=l[i];
      if(c==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(c===','&&!q){out.push(cur.trim());cur='';}
      else cur+=c;}
    out.push(cur.trim());return out;});
  return rows.filter(r=>r.some(c=>c!==''));
}
const isDateCell=v=>/^\d{4}[\/\-年]\d{1,2}[\/\-月]\d{1,2}/.test((v||'').trim());
const numCell=v=>{const n=parseInt(String(v||'').replace(/[^0-9]/g,''),10);return isNaN(n)?0:n;};
function guessCardName(rows,det,fname){
  const f=(fname||'').toLowerCase();
  const head=(det.head||[]).join(',');
  const sample=(det.data&&det.data[0]?det.data[0].join(','):'');
  if(/enavi|rakuten/.test(f))return '楽天カード';
  if(/vpass|smbc|meisai/.test(f))return '三井住友';
  if(/利用店名|利用日/.test(head))return '楽天カード';
  if(det.noHead)return '三井住友';
  if(/摘要|預かり金額|差引残高|支払い金額/.test(head))return '銀行';
  return '';
}
function detectCsv(rows){
  // 1) ヘッダー行を探す
  let hi=-1;
  for(let i=0;i<Math.min(6,rows.length);i++){
    if(rows[i].some(c=>/^(利用日|日付|ご利用日|取引日|年月日)$/.test(c))){hi=i;break;}
  }
  if(hi>=0){
    const head=rows[hi], data=rows.slice(hi+1);
    const find=(re)=>head.findIndex(h=>re.test(h));
    const date=find(/利用日|日付|取引日|年月日/);
    let amt=find(/^利用金額$/); if(amt<0)amt=find(/支払い?金額|出金|引落|^金額$/); if(amt<0)amt=find(/支払総額/);
    let desc=find(/利用店名|摘要内容|利用先|加盟店/); if(desc<0)desc=find(/店名|摘要|内容|商品名/);
    let desc2=head.findIndex((h,i)=>i!==desc&&/摘要$/.test(h));
    return {head,data,map:{date,amt,desc,desc2},name:head.some(h=>/利用店名/.test(h))?'カード明細':'銀行明細'};
  }
  // 2) ヘッダー無し（三井住友VISA等）→ 位置から推定
  const data=rows.filter(r=>isDateCell(r[0]));
  if(!data.length)return null;
  const s=data[0];
  let amt=-1;
  for(let i=1;i<s.length;i++){const n=numCell(s[i]); if(n>0&&n<10000000&&!isDateCell(s[i])){amt=i;break;}}
  const head=rows[0].map((_,i)=>'列'+(i+1));
  while(head.length<s.length)head.push('列'+(head.length+1));
  return {head,data,map:{date:0,amt:amt<0?2:amt,desc:1,desc2:-1},name:'カード明細（ヘッダー無し）',noHead:true};
}
let _csvItems=null, _csvCard='';
$('#csvFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return; e.target.value='';
  const buf=await f.arrayBuffer();
  let text=new TextDecoder('utf-8').decode(buf);
  if(/\uFFFD/.test(text)){try{text=new TextDecoder('shift-jis').decode(buf);}catch(_){}}
  const rows=parseCsvText(text);
  if(rows.length<2){toast('行が読めない');return;}
  const det=detectCsv(rows);
  if(!det){toast('日付の列が見つからない');return;}
  _csvCard=guessCardName(rows,det,f.name);
  const sample=det.data[0]||[];
  const opt=(sel)=>det.head.map((h,i)=>'<option value="'+i+'" '+(sel===i?'selected':'')+'>'+esc(h||('列'+(i+1)))+' … '+esc(String(sample[i]||'').slice(0,14))+'</option>').join('');
  sheet('<h3>CSV取込 1/2 — 列の対応</h3>'
   +'<div class="footnote">'+esc(det.name)+' として認識（'+det.data.length+'行）。カッコ内は1行目の値。違ったら直して</div>'
   +'<div class="frow"><label>日付</label><select id="csv_date">'+opt(det.map.date)+'</select></div>'
   +'<div class="frow"><label>金額</label><select id="csv_amt">'+opt(det.map.amt)+'</select></div>'
   +'<div class="frow"><label>店名・摘要</label><select id="csv_desc">'+opt(det.map.desc)+'</select></div>'
   +'<button class="btn pri" id="csv_next">次へ（中身を確認）</button>');
  $('#csv_next').onclick=()=>{
    const d=+$('#csv_date').value,o=+$('#csv_amt').value,ds=+$('#csv_desc').value,d2=det.map.desc2;
    const items=[]; let bad=0;
    det.data.forEach(r=>{
      if(!isDateCell(r[d]))return;                 // 日付が無い行(小計・注記)は捨てる
      const amt=numCell(r[o]); if(!amt)return;      // 空欄=入金行などは捨てる
      let dt=String(r[d]).replace(/[年月]/g,'/').replace(/日/,'').replace(/-/g,'/');
      const m=dt.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/); if(!m)return;
      dt=m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
      let store=String(r[ds]||'').trim();
      if(d2>=0&&r[d2]&&!store.includes(r[d2]))store=(r[d2]+' '+store).trim();
      if(!store)store='（摘要なし）';
      if(amt>1000000||isDateCell(r[o])){bad++;}     // 明らかな誤マッピング
      const rule=bankRule(store);
      const dup=S.tx.some(x=>x.date===dt&&+x.amount===amt&&!x.skip);
      items.push({date:dt,amount:amt,store,cat:(rule.skip?'その他':(ruleFor(store)||rule.cat||'その他')),
        keihi:keihiFor(store),
        on:!(rule.skip||dup||amt>1000000), why:dup?'既存と同日同額(重複?)':(amt>1000000?'金額が異常。列が違うかも':(rule.why||''))});
    });
    if(!items.length){toast('取り込める行がない');return;}
    if(bad>items.length/2){toast('金額の列が違うかも。戻って選び直して');}
    _csvItems=items; csvPreview();
  };
});

    const allK=$('#cvKeihi').checked; const card=($('#cvCard').value||'').trim()||'CSV'; let n=0;
    items.filter(it=>it.on).forEach(it=>{
      if(addTx({date:it.date,amount:it.amount,store:it.store,cat:it.cat,keihi:allK||!!it.keihi,skip:false,src:'csv',card},{silent:true}))n++;
    });
    closeSheet();renderAll();toast(n+'件 取り込んだ（重複は除外）');
  };
}

/* ---------- AI input / chat ---------- */
function ctxForAI(){
  const st=stats();
  return {period:perLbl(st.p),budgetTotal:S.budget.total,
    fixedPlan:st.fixedPlan,fixedList:S.fixed.map(f=>({name:f.name,amount:f.amount,day:f.day,keihi:!!f.keihi})),
    varBudget:st.varBudget,spentVar:st.spentVar,spentFixed:st.spentFix,
    left:Math.round(st.left),daysLeft:st.daysLeft,
    perCat:st.perCat,perCatBudget:S.budget.per,keihiSum:st.keihiSum,goal:S.goal,
    debts:(S.debts||[]).map(d=>({name:d.name,残債:debtBal(d),年利:d.rate,毎月:d.monthly})),
    recent:st.personal.slice(-60).map(t=>({d:t.date,a:t.amount,s:t.store,c:t.cat}))};
}
function pushBub(cls,txt){const d=document.createElement('div');d.className='bub '+cls;d.textContent=txt;$('#chatLog').appendChild(d);d.scrollIntoView({block:'end'});}
async function handleInput(text){
  const isQ=/[?？]|いくら|どう|買っていい|使った|残り|できる/.test(text)&&!/^\S+\s*[0-9,]+円?$/.test(text.trim());
  // ローカル入力パターン: 店名 金額
  const m=text.trim().match(/^(.+?)[\s　]+([0-9,]+)\s*円?$/);
  if(m&&!isQ){
    const t={date:todayStr(),amount:parseInt(m[2].replace(/,/g,''),10),store:m[1],cat:catFor(m[1]),keihi:false,src:'text'};
    if(addTx(t)){renderAll();toast(fmt(t.amount)+' 記録した（'+t.cat+'）');}
    return;
  }
  // AI行き
  go('s-chat'); pushBub('me',text);
  if(!S.set.gasUrl){pushBub('ai2','GAS未接続。設定でURLと合言葉を入れると、質問・判定・自動分類が動く。「店名 金額」形式なら今も記録できる。');return;}
  pushBub('ai2','…');
  try{
    chatHist.push({role:'user',content:text});
    const j=await api('ai',{mode:'chat',messages:chatHist.slice(-12),context:ctxForAI()});
    $('#chatLog').lastChild.remove();
    const ans=j.text||'（無応答）';
    pushBub('ai2',ans); chatHist.push({role:'assistant',content:ans});
    if(j.tx&&j.tx.length){j.tx.forEach(t=>{t.src='text';t.date=t.date||todayStr();addTx(t,{silent:true});});renderAll();toast(j.tx.length+'件 記録した');}
  }catch(e){$('#chatLog').lastChild.remove();pushBub('ai2','エラー: '+e.message);}
}
/* ---------- 分類（学習ルール優先 → 内蔵辞書） ---------- */
function normKey(store){
  return (store||'').normalize('NFKC').toLowerCase()
    .replace(/[\s　]/g,'')
    .replace(/[（）()＊*・,，.。\-－ー_＋+#＃'"’”\/]/g,'')
    .replace(/[0-9]/g,'')
    .replace(/(店|支店|本店|営業所|利用国[a-z]*|決済|株式会社|㈱)$/,'')
    .slice(0,16);
}
function learnRule(store,cat){
  const k=normKey(store); if(!k||k.length<2||!cat)return;
  S.rules[k]=cat;
}
function ruleFor(store){
  const k=normKey(store); if(!k)return null;
  if(S.rules[k])return S.rules[k];
  // 部分一致（登録キーが店名に含まれる／その逆）— 長いキーを優先
  const keys=Object.keys(S.rules).sort((a,b)=>b.length-a.length);
  for(const rk of keys){ if(rk.length>=3&&(k.includes(rk)||rk.includes(k)))return S.rules[rk]; }
  return null;
}
function catFor(store){ return ruleFor(store)||guessCat(store); }
/* 経費の自動判定（学習ルール優先 → 既定ルール） */
function learnKeihi(store,keihi){const k=normKey(store);if(!k||k.length<2)return;S.krules[k]=!!keihi;}
function keihiFor(store){
  const k=normKey(store); if(!k)return false;
  if(k in S.krules)return S.krules[k];
  const keys=Object.keys(S.krules).sort((a,b)=>b.length-a.length);
  for(const rk of keys){ if(rk.length>=3&&(k.includes(rk)||rk.includes(k)))return S.krules[rk]; }
  const s=(store||'').normalize('NFKC');
  if(/タクシー|GO（|GOアプリ|ＧＯ|Uber ?Taxi|日本交通|kmタクシー|チェッカー|MK ?タクシー|S\.RIDE|DiDi/i.test(s))return true;
  return false;
}
function guessCat(store){
  const s=(store||'').normalize('NFKC');
  if(/セブン|ｾﾌﾞﾝ|ファミリーマート|ﾌｱﾐﾘ|ローソン|ﾛ-ｿﾝ|ミニストップ|コンビニ|イオン|ｲｵﾝ|マルエツ|オーケー|ライフ|西友|スーパー|まいばすけっと|ジャパンビバレッジ|ｼﾞﾔﾊﾟﾝ|自販機|ラーメン|寿司|鮨|居酒屋|食堂|キッチン|レストラン|カフェ|CAFE|スターバックス|ドトール|マクドナルド|吉野家|すき家|松屋|ブロンコビリー|焼肉|定食|弁当|パン|ベーカリー|酒|ビール|まぐろ|廻鮮|泰興|mellow　浦安/i.test(s))return '食費';
  if(/薬|ドラッグ|マツモトキヨシ|ウエルシア|サンドラッグ|ダイソー|セリア|100円|ニトリ|無印|ホームセンター|カインズ|クリーニング|ランドリー/i.test(s))return '日用品';
  if(/JR|ＪＲ|メトロ|東京地下鉄|京急|京成|東急|小田急|西武|東武|タクシー|GO（|GOアプリ|Uber|ウーバー|Suica|ｽｲｶ|PASMO|パスモ|バス|新幹線|駐車|パーキング|ETC|高速|航空|ANA|JAL/i.test(s))return '交通';
  if(/理容|美容|ヘアー|ヘア|サロン|barber|salon|AF浦安|古着|ユニクロ|UNIQLO|GU|ZOZO|しまむら|BEAMS|SHIPS|アパレル|洋服|靴|スニーカー|mellow|イクスピアリ/i.test(s)){
    return S.cats.includes('服・美容')?'服・美容':'日用品';}
  if(/AMAZON|楽天市場|メルカリ|映画|シネマ|TOHO|ゲーム|PLAYSTATION|PS5|Nintendo|STEAM|書店|ブックオフ|漫画|ヤンジャン|音楽|楽器|サウンドハウス|島村|SOUNDFLOW|SUNO|プラグイン|Plugin|Waves|Native Instruments|ライブ|チケット|スタジオ/i.test(s))return '趣味・娯楽';
  if(/NETFLIX|SPOTIFY|U-NEXT|Hulu|Disney|APPLE|Google|ADOBE|ANTHROPIC|OpenAI|ChatGPT|Dropbox|iCloud|UQ|ドコモ|ソフトバンク|au|ahamo|povo|楽天モバイル|電力|東京電力|ガス|水道|NHK|保険|家賃|管理費|ペイペイ|PayPal|月額|会費|年会費/i.test(s))return FIXCAT;
  return 'その他';
}
$('#btnSend').onclick=()=>{const v=$('#aiIn').value.trim();if(!v)return;$('#aiIn').value='';handleInput(v);};
$('#aiIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#btnSend').onclick();}});
$('#btnPhoto').onclick=()=>{ if(!S.set.gasUrl){toast('レシート読取はGAS接続後に使える');return;} $('#photoFile').click(); };
$('#photoFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return; e.target.value='';
  toast('読み取り中…');
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});
  try{
    const j=await api('ai',{mode:'receipt',image:b64,mediaType:f.type||'image/jpeg',cats:S.cats});
    if(j.tx&&j.tx.length){
      const t=j.tx[0]; t.src='photo'; t.date=t.date||todayStr();
      sheet('<h3>レシート確認</h3>'
       +'<div class="frow"><label>店名</label><input id="r_store" value="'+esc(t.store||'')+'"></div>'
       +'<div class="frow"><label>合計</label><input id="r_amt" type="number" value="'+(+t.amount||0)+'"></div>'
       +'<div class="frow"><label>日付</label><input id="r_date" type="date" value="'+t.date+'"></div>'
       +'<div class="frow"><label>カテゴリ</label><select id="r_cat">'+S.cats.map(c=>'<option '+(t.cat===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>'
       +(t.items?('<div class="footnote">品目: '+esc(t.items)+'</div>'):'')
       +'<button class="btn pri" id="r_ok">登録</button>');
      $('#r_ok').onclick=()=>{addTx({date:$('#r_date').value,amount:+$('#r_amt').value,store:$('#r_store').value,cat:$('#r_cat').value,keihi:false,src:'photo',memo:t.items||''});closeSheet();renderAll();toast('登録した');};
    }else toast('読めなかった');
  }catch(err){toast('読取エラー: '+err.message);}
});

/* ---------- nav ---------- */
function go(s){ if(s!=='s-tx'){catFilter='';keihiFilter=false;} curTab=s;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===s));
  $('#ibar').classList.toggle('hidden',!(s==='s-home'||s==='s-tx'||s==='s-chat'));
  renderAll();
  scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.s));
window.openDebt=()=>{
  const ds=debtStats();
  let h='<h3>借金・返済</h3>';
  h+='<div class="group" style="margin-bottom:12px"><div class="row44 num"><span style="flex:1">残債合計</span><span style="font-weight:700;color:var(--red)">'+fmt(ds.totalBal)+'</span></div>'
   +'<div class="row44 num"><span style="flex:1">元の総額</span><span style="color:var(--sec)">'+fmt(ds.totalOrig)+'</span></div>'
   +'<div class="row44 num"><span style="flex:1">毎月の返済</span><span style="font-weight:600">'+fmt(ds.monthly)+'</span></div>'
   +(ds.lastEnd?'<div class="row44 num"><span style="flex:1">完済予定</span><span style="font-weight:600;color:var(--green)">'+ds.lastEnd.getFullYear()+'年'+(ds.lastEnd.getMonth()+1)+'月</span></div>':'')
   +'</div>';
  ds.list.forEach(d=>{
    h+='<div class="group" style="margin-bottom:10px;padding:12px 16px">'
     +'<div style="display:flex;align-items:baseline;gap:8px"><b style="font-size:15px">'+esc(d.name)+'</b>'
     +'<span class="num" style="margin-left:auto;font-weight:700;color:'+(d.bal?'var(--red)':'var(--green)')+'">'+(d.bal?fmt(d.bal):'完済 ✓')+'</span></div>'
     +'<div class="row44 num" style="padding:8px 0"><span class="bar"><i style="width:'+d.pct+'%;background:var(--green)"></i></span><span class="pct" style="width:50px">'+d.pct+'%</span></div>'
     +'<div class="footnote num" style="padding:0">'+fmt(d.paid)+' 返済済 / '+fmt(d.total)+(d.rate?(' ・ 年利'+d.rate+'%'):'')+(d.monthly?(' ・ 毎月'+fmt(d.monthly)):'')+'</div>';
    if(d.bal>0&&d.monthly){
      if(!isFinite(d.months))h+='<div class="footnote warn" style="padding:6px 0 0">毎月の返済が利息を下回っていて、このままだと減らない</div>';
      else h+='<div class="footnote" style="padding:6px 0 0">あと <b style="color:var(--label)">'+d.months+'ヶ月</b>（'+d.end.getFullYear()+'/'+(d.end.getMonth()+1)+'）・ 今後の利息 '+fmt(d.interest)+'</div>';
    }
    if(d.bal>0){
      h+='<div style="display:flex;gap:8px;margin-top:10px"><input class="rpAmt" data-id="'+d.id+'" type="number" placeholder="返済額" style="flex:1">'
       +'<button class="btn sm rpGo" data-id="'+d.id+'">返済を記録</button></div>';
    }
    h+='<div style="height:8px"></div><button class="btn sm dbDel" data-id="'+d.id+'" style="color:var(--red)">この借金を削除</button></div>';
  });
  h+='<div class="sect" style="padding-left:0">借金を追加</div><div class="group" style="padding:12px 16px">'
   +'<div class="frow"><input id="db_name" placeholder="名前（例: カードローン）"></div>'
   +'<div class="frow"><div class="inline"><input id="db_total" type="number" placeholder="総額（円）" style="flex:1.4">'
   +'<input id="db_rate" type="number" step="0.1" placeholder="年利%" style="flex:.9">'
   +'<input id="db_month" type="number" placeholder="毎月返済" style="flex:1.2"></div></div>'
   +'<div class="frow"><input id="db_paid" type="number" placeholder="すでに返した額（任意）"></div>'
   +'<button class="btn sm" id="db_add">追加</button></div>';
  if(ds.list.some(d=>d.bal>0)&&S.set.gasUrl)
    h+='<div style="height:10px"></div><button class="btn" id="db_ai">AIに返済プランを相談する</button>';
  sheet(h);
  document.querySelectorAll('.rpGo').forEach(b=>b.onclick=()=>{
    const inp=document.querySelector('.rpAmt[data-id="'+b.dataset.id+'"]');
    const v=+inp.value||0; if(!v){toast('返済額を入れて');return;}
    addRepay(b.dataset.id,v); closeSheet(); renderAll(); toast(fmt(v)+' 返済を記録した'); });
  document.querySelectorAll('.dbDel').forEach(b=>b.onclick=()=>{
    if(b.dataset.arm){S.debts=S.debts.filter(x=>x.id!==b.dataset.id);S.repays=S.repays.filter(r=>r.debtId!==b.dataset.id);save();closeSheet();renderAll();toast('削除した');}
    else{b.dataset.arm='1';b.textContent='本当に削除（もう一度）';}});
  $('#db_add').onclick=()=>{
    const name=$('#db_name').value.trim(), total=+$('#db_total').value||0;
    if(!name||!total){toast('名前と総額を入れて');return;}
    const id=uid();
    S.debts.push({id,name,total,rate:+$('#db_rate').value||0,monthly:+$('#db_month').value||0});
    const already=+$('#db_paid').value||0;
    if(already)S.repays.push({id:uid(),debtId:id,amount:already,date:todayStr()});
    save(); openDebt(); renderAll(); toast('追加した'); };
  const dbai=$('#db_ai'); if(dbai)dbai.onclick=async()=>{
    dbai.textContent='考えてる…';
    try{ const j=await api('ai',{mode:'debt',context:{...ctxForAI(),
      debts:ds.list.map(d=>({name:d.name,残債:d.bal,年利:d.rate,毎月:d.monthly,あと何ヶ月:isFinite(d.months)?d.months:'減らない',今後の利息:d.interest}))}});
      sheet('<h3>返済プラン</h3><div style="font-size:14.5px;line-height:1.8;white-space:pre-wrap">'+esc(j.text||'')+'</div>'
        +'<div style="height:12px"></div><button class="btn" onclick="openDebt()">戻る</button>');
    }catch(e){toast('AIエラー: '+e.message);dbai.textContent='AIに返済プランを相談する';} };
};
document.addEventListener('click',e=>{
  const dd=e.target.closest('.goDebt'); if(dd){openDebt();return;}
  const c=e.target.closest('.goCat'); if(c){openCat(c.dataset.cat);return;}
  const k=e.target.closest('.goKeihi'); if(k){openKeihi();return;}
  const d=e.target.closest('.goCard'); if(d){openCard(d.dataset.card);return;}
});
function renderAll(){
  $('#perTxt').textContent=perLbl(period())+(perOff?'':' ・ 今月');
  $('#perNext').style.opacity=perOff>=0?'.3':'1';
  if(curTab==='s-home')renderHome();
  if(curTab==='s-tx')renderTx();
  if(curTab==='s-rep')renderRep();
  if(curTab==='s-set')renderSet();
}
$('#perPrev').onclick=()=>{perOff--;renderAll();};
$('#perNext').onclick=()=>{if(perOff<0){perOff++;renderAll();}};

/* ---------- boot ---------- */
load(); go('s-home'); renderAll();
if(S.set.gasUrl)syncPull(true);
setInterval(()=>{if(S.set.gasUrl&&document.visibilityState==='visible')syncPull(true);},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
